# Global configuration
global:
  scrape_interval: 15s  # Set the scrape interval to every 15 seconds.
  evaluation_interval: 15s  # Evaluate rules every 15 seconds.

# Alertmanager configuration (if you are using Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # Uncomment the following line if you have Alertmanager running
          # - alertmanager:9093

# Rule files (Optional, if you have alerting rules or recording rules)
rule_files:
# - "first_rules.yml"
# - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Scrape Prometheus server itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape the Spring application (Backend)
  - job_name: "spring-app"
    metrics_path: /actuator/prometheus  # Prometheus metrics endpoint
    static_configs:
      - targets: ["spring-app:8089"]  # Docker container name and port where Spring app exposes Prometheus metrics

  # Scrape Grafana (Optional, if you want to monitor Grafana as well)
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]  # Docker container name and port where Grafana exposes metrics (port 3000 by default)

  # Scrape MySQL metrics (Optional, if MySQL exposes Prometheus metrics)
  - job_name: "mysql"
    metrics_path: /metrics  # Change this if MySQL exposes a different path for Prometheus metrics
    static_configs:
      - targets: ["mysql-db:9104"]  # Docker container name and port for MySQL exporter (port 9104)
