

services:
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 0000
      MYSQL_DATABASE: mariem-db-1
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      command: --default-authentication-plugin=mysql_native_password
    restart: always

  app:
    image: mariemkhamassi/alpine:1.0.0 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sql3700427?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 0000
    ports:
      - "8082:8082"
    depends_on:
      - db

volumes:
  db-data:
